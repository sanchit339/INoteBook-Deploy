<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eclipse IDE for Enterprise Java and Web Developers">
  <defs>
    <linearGradient id="jeeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2758"/>
      <stop offset="100%" stop-color="#16132e"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="100%" stop-color="#d8d8d4"/>
    </linearGradient>
    <clipPath id="mugClip">
      <path d="M16 20h22c1.4 0 2.5 1.2 2.5 2.6v16.8c0 5.4-5.2 9.6-13.5 9.6S13.5 44.8 13.5 39.4V22.6C13.5 21.2 14.6 20 16 20z"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="url(#jeeBg)"/>
  <!-- mug handle -->
  <path d="M41 26c7 0 10 4 10 8.5S48 43 41 43" fill="none" stroke="#e6e6e2" stroke-width="4.2" stroke-linecap="round"/>
