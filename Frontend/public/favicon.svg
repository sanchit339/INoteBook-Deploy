  <path d="M16 20h22c1.4 0 2.5 1.2 2.5 2.6v16.8c0 5.4-5.2 9.6-13.5 9.6S13.5 44.8 13.5 39.4V22.6C13.5 21.2 14.6 20 16 20z" fill="url(#mug)"/>
  <!-- eclipse globe inside mug -->
  <g clip-path="url(#mugClip)">
    <circle cx="27" cy="34" r="12.5" fill="#cfd6de"/>
    <circle cx="33.5" cy="32.5" r="10.5" fill="#2c2255"/>
    <path d="M38 40.5 A13 13 0 0 1 24 48" fill="none" stroke="#f7941e" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- orange orbit around mug -->
  <path d="M44 42 A16 16 0 0 1 24 52" fill="none" stroke="#f7941e" stroke-width="3.4" stroke-linecap="round"/>
  <!-- JDT public class overlay -->
  <circle cx="46" cy="46" r="13" fill="#2e7d32"/>
  <text x="46" y="51.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">C</text>
